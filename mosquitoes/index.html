<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Six animated procedural mosquito models for Three.js" />
    <title>Animated Mosquito Species — Three.js</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <canvas id="scene" aria-label="Interactive 3D mosquito model"></canvas>
      <header>
        <div class="eyebrow"><span></span> SPECIMEN STUDY / 03</div>
        <h1 id="species-title">Aedes aegypti</h1>
        <p>Explore the scales, lenses and wing structure.</p>
      </header>
      <section class="controls" aria-label="Model controls">
        <label>
          <span>Species</span>
          <select id="species"></select>
        </label>
        <label>
          <span>Wings</span>
          <select id="pose"><option value="flight">Beating · slow motion</option><option value="rest">Folded · inspect detail</option></select>
        </label>
        <label>
          <span>Wing speed <output id="speed-value">1.0×</output></span>
          <input id="wing-speed" type="range" min="0" max="2" step="0.1" value="1" />
        </label>
        <div class="button-row">
          <button id="pause" type="button">Pause motion</button>
          <button id="macro" type="button">Macro view</button>
          <button id="reset" type="button">Full specimen</button>
          <button id="export" class="primary" type="button">Export animated GLB</button>
        </div>
        <small id="status" role="status">Drag to orbit · scroll to examine</small>
      </section>
      <aside>
        <strong>06</strong>
        <span>SPECIES<br />SYSTEM</span>
      </aside>
    </main>
    <script type="module" src="./main.js?v=3"></script>
  </body>
</html>
